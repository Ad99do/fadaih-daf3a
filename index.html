<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>يلا نشوف الفضايح 🤣</title>
<style>
:root{--bg:#0b1020;--panel:#141a33;--panel2:#1c2444;--line:rgba(255,255,255,.08);--txt:#f4f6ff;--sub:#98a2c9;--a:#7c5cff;--b:#ff5c9d;--gold:#ffc857}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
header{padding:calc(18px + env(safe-area-inset-top,0px)) 16px 22px;text-align:center;background:radial-gradient(120% 100% at 50% 0,#2b2170 0,var(--bg) 70%)}
.row{display:flex;justify-content:space-between;align-items:center}
.tag{font-size:.8rem;color:#d9d2ff;background:rgba(124,92,255,.22);border:1px solid rgba(124,92,255,.4);padding:5px 14px;border-radius:99px}
#lock{font-size:1.3rem;padding:6px 10px;cursor:pointer}
h1{font-size:2rem;font-weight:900;margin:16px 0 6px;background:linear-gradient(90deg,#fff,var(--b),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:.85rem;color:var(--sub)}
.chips{display:flex;gap:8px;justify-content:center;margin-top:16px}
.chip{flex:1;max-width:120px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 4px}
.chip b{display:block;font-size:1.3rem}
.chip span{font-size:.72rem;color:var(--sub)}
main{max-width:520px;margin:0 auto;padding:0 14px}
#search{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:.95rem;outline:none;margin:6px 0 14px}
#search:focus{border-color:var(--a)}
.sec{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.sec h2{font-size:1.05rem}
.hint{font-size:.72rem;color:var(--sub)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden}
.ch{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1.1rem;background:linear-gradient(135deg,var(--a),var(--b));flex:none}
.boys .av{background:linear-gradient(135deg,#3b82f6,var(--a))}
.info{flex:1;min-width:0}
.nm{font-weight:800;font-size:1.02rem}
.top{font-size:.75rem;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top.none{color:var(--sub)}
.cnt{font-size:.75rem;background:var(--panel2);color:var(--sub);padding:4px 10px;border-radius:99px}
.arrow{color:var(--sub);transition:transform .2s}
.card.open .arrow{transform:rotate(180deg)}
.opts{display:none;padding:0 12px 12px;gap:7px;grid-template-columns:1fr}
.card.open .opts{display:grid}
.opt{position:relative;overflow:hidden;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;justify-content:space-between;cursor:pointer;user-select:none}
.opt.mine{border-color:var(--b)}
.bar{position:absolute;inset:0 0 0 auto;background:linear-gradient(270deg,rgba(124,92,255,.45),rgba(255,92,157,.25));transition:width .4s}
.opt span{position:relative;font-size:.88rem}
.opt .v{font-weight:800;color:var(--b)}
.lb{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.rk{font-size:1.2rem;min-width:34px;text-align:center}
.lb .t{flex:1}
.lb .t small{display:block;color:var(--sub);font-size:.8rem;margin-top:2px}
.lb .n{font-weight:900;color:var(--gold)}
.empty{text-align:center;color:var(--sub);padding:30px 10px}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(11,16,32,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:20}
.tab{flex:1;border:none;background:transparent;color:var(--sub);padding:10px 4px;border-radius:14px;font-weight:700;font-size:.85rem;cursor:pointer}
.tab.on{background:linear-gradient(90deg,var(--a),var(--b));color:#fff}
#admin{display:none;margin-top:20px;background:#1d0f1c;border:1px solid #ef4444;border-radius:16px;padding:16px}
#admin button{background:#dc2626;color:#fff;border:none;padding:9px 14px;border-radius:10px;font-weight:800;margin:10px 0;cursor:pointer}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid var(--line);padding:7px;text-align:right;font-size:.82rem}
th{background:var(--panel2);color:var(--b)}
#toast{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--a);color:#fff;padding:10px 18px;border-radius:12px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .3s;z-index:30}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="row"><span class="tag">دفعتنا تحت المجهر 🔍</span><span><span>♦️ 🤣</span><span id="lock">🔒</span></span></div>
  <h1>يلا نشوف الفضايح 🤣</h1>
  <p class="sub">اختار التصنيف وشوف النسبة فوراً.. وتقدر تصوّت لأكثر من صفة!</p>
  <div class="chips">
    <div class="chip"><b id="sTotal">0</b><span>تصويت مسجل</span></div>
    <div class="chip"><b id="sGirls">0</b><span>طالبة 👩</span></div>
    <div class="chip"><b id="sBoys">0</b><span>طالب 👦</span></div>
  </div>
</header>

<main>
  <input id="search" type="search" placeholder="ابحث عن اسم بالدفعة...">
  <div class="sec"><h2 id="secT">✨ قائمة الطالبات</h2><span class="hint" id="secH">اضغط على الاسم ثم اختر الصفة</span></div>
  <div id="girls"></div>
  <div id="boys" class="boys" style="display:none"></div>
  <div id="lbox" style="display:none"></div>

  <div id="admin">
    <h3 style="color:#f87171">🔒 لوحة الأدمن</h3>
    <button id="reset">تصفير جميع الأصوات ⚠️</button>
    <div class="tw"><table><thead><tr><th>المُصوَّت عليه</th><th>الصفة</th><th>الوقت</th></tr></thead><tbody id="logs"></tbody></table></div>
  </div>
</main>

<nav>
  <button class="tab on" data-t="girls">👩 البنات</button>
  <button class="tab" data-t="boys">👦 الأولاد</button>
  <button class="tab" data-t="lbox">🏆 المتصدرون</button>
</nav>
<div id="toast"></div>

<script>
(function(){
const URL_ = "https://kstnagfousuiwbnikkwi.supabase.co";
const KEY = "sb_publishable_7xQHPTjLP82fhRQjVY1vfw_nHGBbKKt";
const PASS = "9014994";

const G = {
  girls:{
    list:["وعد أمين","مأب محمد","نفيسه","رغده","مروه","شهد","قمر","رهام","ساجده","سبأ","ريان","ترتيل","دعاء","دلال","دعاء 2","سارة","امنية","زينب","ابرار","ضحى","مأب عصام","شهد محمد","أسيل","وعد عامر","عناب"],
    opts:["1/ إجتماعيه ✨","2/ الحفارة 🎓","3/ السواطة 🤣","4/ القطيعه 🤣","5/ المهذبه ❣️","6/ البعيده عن الدفعه 😐","7/ نجمة الدفعة ♦️","8/ العايشه الدور 🤣","9/ الخسيسه 😶","10/ أم لساان طويل 👅","11/ البتنوم في المحاضره 😴","12/ الخفيفه الرشيقه ⚡"]
  },
  boys:{
    list:["منذر","ايمن","مجتبى سليمان","ماهر خالد","محمد عثمان جاد الله","محمد حسن","احمد البشير","احمد سامي","حسام المكنه","محمد عاطف","اواب","محمد خالد","الجيلى","التجاني","المثنى مزمل","عبدالله","نزار","أمجد","عبدالرحيم","محمد خوجلي","عبدالرحمن رضوان","المقداد صلاح","محمد","ادم تصرف ساي","وائل","مبارك خليل","عبدالله عبد الله","الطيب كمال الطيب","عاصم"],
    opts:["1/ الحفار الخسيس 🎓","2/ بتاع الونسه 🫥","3/ الخسيس 😐","4/ نجم الدفعة ♦️","5/ اجتماعي ❤️","6/ مبتعد عن الدفعة 😬","7/ ملك التصرف الساي 🤣","8/ المهذب ❣️","9/ الطقه والقهوة 🥴","10/ الموهوم 😶","11/ البساعد الناس 🤍","12/ صاحب الضحكه المميزه 🤣🌝","13/ الخفيف الرشيق ⚡"]
  }
};

let votes = {}, mine = new Set(), openKey = null, tab = 'girls';
try { mine = new Set(JSON.parse(localStorage.getItem('mine2') || '[]')); } catch(e){}
const save = () => { try { localStorage.setItem('mine2', JSON.stringify([...mine])); } catch(e){} };
const $ = id => document.getElementById(id);
const clean = s => s.replace(/^\d+\//,'').trim();
const kk = (n,o) => n + '_' + o;
const mk = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),2200); }

async function sb(path, o){
  o = o || {};
  const r = await fetch(URL_ + '/rest/v1/' + path, {
    method: o.method || 'GET',
    headers: Object.assign({apikey: KEY, 'Content-Type':'application/json'}, o.headers || {}),
    body: o.body ? JSON.stringify(o.body) : undefined
  });
  if (!r.ok) throw new Error(r.status);
  const t = await r.text(); return t ? JSON.parse(t) : null;
}

async function pull(){
  try {
    const d = await sb('votes?select=*'), f = {};
    (d || []).forEach(v => f[v.vote_key] = v.count);
    if (JSON.stringify(f) !== JSON.stringify(votes)){ votes = f; draw(); }
  } catch(e){}
}

function card(gid, name){
  const g = G[gid], ck = gid + ':' + name;
  const counts = g.opts.map(o => votes[kk(name,o)] || 0);
  const total = counts.reduce((a,b)=>a+b,0);
  const mx = Math.max.apply(null, counts), ti = counts.indexOf(mx);

  const c = mk('div', 'card' + (openKey === ck ? ' open' : ''));
  c.dataset.name = name; c.dataset.ck = ck;

  const h = mk('div','ch');
  const av = mk('div','av', name.trim().charAt(0));
  const info = mk('div','info');
  info.append(mk('div','nm',name), mk('div','top' + (mx ? '' : ' none'), mx ? '🔥 ' + clean(g.opts[ti]) + ' (' + mx + ')' : 'ما في أصوات بعد'));
  h.append(av, info, mk('span','cnt', total + ' صوت'), mk('span','arrow','▾'));
  h.addEventListener('click', () => { openKey = openKey === ck ? null : ck; draw(); });

  const ol = mk('div','opts');
  g.opts.forEach((o,i) => {
    const pct = total ? Math.round(counts[i]/total*100) : 0;
    const el = mk('div','opt' + (mine.has(kk(name,o)) ? ' mine' : ''));
    const bar = mk('div','bar'); bar.style.width = pct + '%';
    el.append(bar, mk('span','',clean(o)), mk('span','v', pct + '% (' + counts[i] + ')'));
    el.addEventListener('click', () => vote(gid, name, i));
    ol.appendChild(el);
  });
  c.append(h, ol);
  return c;
}

function drawLB(){
  const items = [];
  Object.keys(G).forEach(gid => G[gid].list.forEach(n => G[gid].opts.forEach(o => {
    const c = votes[kk(n,o)] || 0; if (c > 0) items.push({n, o: clean(o), c});
  })));
  items.sort((a,b) => b.c - a.c);
  const box = $('lbox'); box.textContent = '';
  if (!items.length){ box.appendChild(mk('div','empty','لا توجد أصوات مسجلة حتى الآن.')); return; }
  items.slice(0,50).forEach((it,i) => {
    const r = mk('div','lb');
    const t = mk('div','t'); t.append(mk('b','',it.n), mk('small','',it.o));
    r.append(mk('div','rk', i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1)), t, mk('div','n', it.c + ' أصوات'));
    box.appendChild(r);
  });
}

function draw(){
  ['girls','boys'].forEach(gid => {
    const box = $(gid); box.textContent = '';
    G[gid].list.forEach(n => box.appendChild(card(gid, n)));
  });
  drawLB();
  let s = 0; for (const k in votes) s += votes[k] || 0;
  $('sTotal').textContent = s;
  filter();
}

async function vote(gid, name, i){
  const o = G[gid].opts[i], k = kk(name,o);
  if (mine.has(k)){ toast('صوّتّ لهذه الصفة من قبل ✋'); return; }
  votes[k] = (votes[k] || 0) + 1; mine.add(k); save(); draw(); toast('تم تسجيل صوتك ✅');
  try {
    const cur = await sb('votes?select=count&vote_key=eq.' + encodeURIComponent(k));
    const n = (cur && cur[0] ? cur[0].count : 0) + 1;
    await sb('votes?on_conflict=vote_key', {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'}, body:{vote_key:k, count:n}});
    votes[k] = n; draw();
    const time = new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
    await sb('logs', {method:'POST', headers:{Prefer:'return=minimal'}, body:{name, option:clean(o), time}});
  } catch(e){
    votes[k] = Math.max(0,(votes[k]||1)-1); mine.delete(k); save(); draw();
    toast('ما انحفظ الصوت، جرّب مرة ثانية ⚠️');
  }
}

const T = {girls:['✨ قائمة الطالبات','اضغط على الاسم ثم اختر الصفة'], boys:['⚡ قائمة الطلاب','اضغط على الاسم ثم اختر الصفة'], lbox:['🏆 المتصدرون','أعلى الأصوات في الدفعة']};
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  tab = b.dataset.t;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  ['girls','boys','lbox'].forEach(id => $(id).style.display = id === tab ? 'block' : 'none');
  $('secT').textContent = T[tab][0]; $('secH').textContent = T[tab][1];
  $('search').style.display = tab === 'lbox' ? 'none' : 'block';
  window.scrollTo({top:0});
}));

function filter(){
  const q = $('search').value.toLowerCase().trim();
  document.querySelectorAll('.card[data-name]').forEach(c => c.style.display = c.dataset.name.toLowerCase().includes(q) ? '' : 'none');
}
$('search').addEventListener('input', filter);

let taps = 0, th;
$('lock').addEventListener('click', () => {
  taps++; clearTimeout(th); th = setTimeout(() => taps = 0, 1500);
  if (taps >= 3){
    taps = 0;
    if (prompt('أدخل كلمة سر الأدمن:') === PASS){
      $('admin').style.display = 'block';
      sb('logs?select=*&order=id.desc&limit=50').then(d => {
        const tb = $('logs'); tb.textContent = '';
        (d || []).forEach(l => { const tr = mk('tr'); [l.name,l.option,l.time].forEach(x => tr.appendChild(mk('td','',x == null ? '' : x))); tb.appendChild(tr); });
      }).catch(()=>{});
      $('admin').scrollIntoView({behavior:'smooth'});
    }
  }
});

$('reset').addEventListener('click', async () => {
  if (!confirm('هل أنت متأكد من مسح جميع الأصوات؟')) return;
  try {
    await sb('votes?count=gte.0', {method:'DELETE'});
    await sb('logs?id=gte.0', {method:'DELETE'});
    votes = {}; mine = new Set(); save(); draw(); $('logs').textContent = ''; toast('تم التصفير ✅');
  } catch(e){ toast('فشل التصفير، تأكد من سياسة DELETE ⚠️'); }
});

$('sGirls').textContent = G.girls.list.length;
$('sBoys').textContent = G.boys.list.length;
draw(); pull(); setInterval(pull, 4000);
})();
</script>
</body>
</html>
