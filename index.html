<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>يلا نشوف الفضايح 🤣</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-dark: #12081d;
            --purple-header: #2e1847;
            --purple-card: #1a0b2e;
            --purple-btn: #6b21a8;
            --text-main: #ffffff;
            --text-sub: #b3a1c9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            min-height: 100vh;
            color: var(--text-main);
            padding-bottom: 40px;
        }

        .hero-header {
            background: linear-gradient(180deg, #2a1145 0%, #1a0b2e 100%);
            color: white;
            padding: 25px 20px 45px 20px;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            text-align: center;
            border-bottom: 1px solid rgba(168, 85, 247, 0.2);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .badge-pill {
            background: rgba(107, 33, 168, 0.4);
            border: 1px solid rgba(168, 85, 247, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #e9d5ff;
        }

        .admin-lock {
            cursor: pointer;
            font-size: 1.1rem;
            color: #a855f7;
            opacity: 0.8;
        }

        .hero-title {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #e9d5ff, #f472b6, #fef08a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-bottom: 10px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: -30px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 12px 5px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .stat-num {
            font-size: 1.4rem;
            font-weight: 900;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #64748b;
            font-weight: bold;
            margin-top: 3px;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            background: rgba(30, 15, 48, 0.8);
            padding: 6px;
            border-radius: 16px;
            border: 1px solid rgba(168, 85, 247, 0.2);
        }

        .tab-btn {
            flex: 1;
            padding: 12px 5px;
            border: none;
            background: transparent;
            color: #c084fc;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: linear-gradient(90deg, #7e22ce, #db2777);
            color: white;
            box-shadow: 0 4px 15px rgba(219, 39, 119, 0.4);
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            background: #1b0c2e;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 5px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #e9d5ff;
        }

        .section-hint {
            font-size: 0.75rem;
            color: var(--text-sub);
            background: rgba(46, 24, 71, 0.6);
            padding: 4px 10px;
            border-radius: 8px;
        }

        .person-card {
            background: var(--purple-card);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .person-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .person-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
        }

        .person-rank {
            font-size: 0.75rem;
            color: #c084fc;
            background: rgba(107, 33, 168, 0.4);
            padding: 3px 10px;
            border-radius: 10px;
        }

        .options-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .option-item {
            background: #24103c;
            border: 1px solid rgba(168, 85, 247, 0.15);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .option-progress {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(270deg, rgba(168, 85, 247, 0.3), rgba(236, 72, 153, 0.2));
            z-index: 1;
            transition: width 0.4s ease;
        }

        .option-label {
            position: relative;
            z-index: 2;
            font-size: 0.88rem;
            font-weight: 500;
            color: #f3e8ff;
        }

        .option-val {
            position: relative;
            z-index: 2;
            font-size: 0.85rem;
            font-weight: bold;
            color: #f472b6;
        }

        .lb-card {
            background: var(--purple-card);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .admin-panel {
            display: none;
            background: #180929;
            padding: 20px;
            border-radius: 18px;
            margin-top: 20px;
            border: 1px solid #ef4444;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px;
            text-align: right;
            font-size: 0.85rem;
        }

        th { background: #2e1847; color: #f472b6; }
    </style>
</head>
<body>

<div class="hero-header">
    <div class="top-bar">
        <span class="badge-pill">دفعتنا تحت المجهر 🔍</span>
        <div style="display:flex; gap:10px; align-items:center;">
            <span>♦️ 🤣</span>
            <i class="fas fa-lock admin-lock" id="adminLockIcon"></i>
        </div>
    </div>
    <h1 class="hero-title">يلا نشوف الفضايح 🤣</h1>
    <p class="hero-subtitle">اختار التصنيف وشوف النسبة المئوية فوراً.. وتقدر تصوّت لأكثر من صفة!</p>
</div>

<div class="container">
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-num" style="color:#581c87" id="totalVotesCount">0</div>
            <div class="stat-label">تصويت مسجل</div>
        </div>
        <div class="stat-card">
            <div class="stat-num" style="color:#db2777" id="girlsCount">24</div>
            <div class="stat-label">طالبة 👩</div>
        </div>
        <div class="stat-card">
            <div class="stat-num" style="color:#4f46e5" id="boysCount">29</div>
            <div class="stat-label">طالب 👦</div>
        </div>
    </div>

    <div class="nav-tabs">
        <button id="tab-girls" class="tab-btn active" onclick="switchTab('girls')">👩 البنات</button>
        <button id="tab-boys" class="tab-btn" onclick="switchTab('boys')">👦 الأولاد</button>
        <button id="tab-leaderboard" class="tab-btn" onclick="switchTab('leaderboard')">🏆 المتصدرون</button>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن اسم بالدفعة..." onkeyup="filterNames()">
    </div>

    <div id="sectionTitleHeader" class="section-header">
        <span class="section-title" id="sectionTitleText">✨ قائمة الطالبات</span>
        <span class="section-hint">اضغط على أي صفة لتأكيد تصويتك</span>
    </div>

    <div id="girlsSection"></div>
    <div id="boysSection" style="display:none;"></div>
    <div id="leaderboardSection" style="display:none;">
        <div id="leaderboardContent"></div>
    </div>

    <!-- Admin Panel -->
    <div id="adminSection" class="admin-panel">
        <h2 style="color:#f87171;">🔒 لوحة التحكم السرية للأدمن</h2>
        <button onclick="resetAllData()" style="background:#dc3545; color:white; border:none; padding:8px 12px; border-radius:8px; margin: 10px 0; cursor:pointer; font-weight:bold;">تصفير جميع الأصوات ⚠️</button>
        <table id="votesTable">
            <thead>
                <tr>
                    <th>المُصوَّت عليه</th>
                    <th>الصفة المختارة</th>
                    <th>وقت التصويت</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://kstnagfousuiwbnikkwi.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7xQHPTjLP82fhRQjVY1vfw_nHGBbKKt";
    let _supabase = null;

    const boysOptions = [
        "1/ الحفار الخسيس 🎓", "2/ بتاع الونسه 🫥", "3/ الخسيس 😐", 
        "4/ نجم الدفعة ♦️", "5/ اجتماعي ❤️", "6/ مبتعد عن الدفعة 😬", 
        "7/ ملك التصرف الساي 🤣", "8/ المهذب ❣️", "9/ الطقه والقهوة 🥴", 
        "10/ الموهوم 😶", "11/ البساعد الناس 🤍", "12/ صاحب الضحكه المميزه 🤣🌝", 
        "13/ الخفيف الرشيق ⚡"
    ];
    
    const girlsOptions = [
        "1/ إجتماعيه ✨", "2/ الحفارة 🎓", "3/ السواطة 🤣", 
        "4/ القطيعه 🤣", "5/ المهذبه ❣️", "6/ البعيده عن الدفعه 😐", 
        "7/ نجمة الدفعة ♦️", "8/ العايشه الدور 🤣", "9/ الخسيسه 😶", 
        "10/ أم لساان طويل 👅", "11/ البتنوم في المحاضره 😴", "12/ الخفيفه الرشيقه ⚡"
    ];

    const boysList = ["منذر", "ايمن", "مجتبى سليمان", "ماهر خالد", "محمد عثمان جاد الله", "محمد حسن", "احمد البشير", "احمد سامي", "حسام المكنه", "محمد عاطف", "اواب", "محمد خالد", "الجيلى", "التجاني", "المثنى مزمل", "عبدالله", "نزار", "أمجد", "عبدالرحيم", "محمد خوجلي", "عبدالرحمن رضوان", "المقداد صلاح", "محمد", "ادم تصرف ساي", "وائل", "مبارك خليل", "عبدالله عبد الله", "الطيب كمال الطيب", "عاصم"];
    const girlsList = ["وعد أمين", "مأب", "نفيسه", "رغده", "مروه", "شهد", "قمر", "رهام", "ساجده", "سبأ", "ريان", "ترتيل", "دعاء", "دلال", "دعاء 2", "سارة", "امنية", "زينب", "ابرار", "ضحى", "مأب التانيه", "شهد محمد", "وعد عامر", "عناب"];

    let votesData = {};
    let logsData = [];

    function renderList(list, options, containerId) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';

        list.forEach((name) => {
            let totalPersonVotes = 0;
            options.forEach(opt => {
                const key = `${name}_${opt}`;
                totalPersonVotes += (votesData[key] || 0);
            });

            const card = document.createElement('div');
            card.className = "person-card";
            card.setAttribute('data-name', name);

            let optionsHTML = '';
            options.forEach(opt => {
                const key = `${name}_${opt}`;
                const count = votesData[key] || 0;
                const percent = totalPersonVotes > 0 ? Math.round((count / totalPersonVotes) * 100) : 0;
                const cleanOpt = opt.replace(/^\d+\//, '').trim();

                optionsHTML += `
                    <div class="option-item" onclick="castVote('${name}', '${opt}')">
                        <div class="option-progress" style="width: ${percent}%"></div>
                        <span class="option-label">${cleanOpt}</span>
                        <span class="option-val">${percent}% (${count})</span>
                    </div>
                `;
            });

            card.innerHTML = `
                <div class="person-header">
                    <span class="person-name">${name}</span>
                    <span class="person-rank">أصوات: ${totalPersonVotes}</span>
                </div>
                <div class="options-list">${optionsHTML}</div>
            `;
            container.appendChild(card);
        });
    }

    function refreshUI() {
        renderList(girlsList, girlsOptions, 'girlsSection');
        renderList(boysList, boysOptions, 'boysSection');
        renderLeaderboard();
        renderAdminLogs();
        calculateTotalVotes();
    }

    function calculateTotalVotes() {
        let sum = 0;
        for (let k in votesData) sum += votesData[k];
        const elem = document.getElementById('totalVotesCount');
        if (elem) elem.innerText = sum;
    }

    function renderLeaderboard() {
        const container = document.getElementById('leaderboardContent');
        if (!container) return;
        const items = [];

        for (let key in votesData) {
            if (votesData[key] > 0) {
                const parts = key.split('_');
                if (parts.length >= 2) {
                    items.push({
                        name: parts[0],
                        option: parts.slice(1).join('_').replace(/^\d+\//, '').trim(),
                        count: votesData[key]
                    });
                }
            }
        }

        items.sort((a, b) => b.count - a.count);

        if (items.length === 0) {
            container.innerHTML = `<div class="person-card" style="text-align:center; color:var(--text-sub);">لا توجد أصوات مسجلة حتى الآن.</div>`;
            return;
        }

        let html = '';
        items.forEach((item, rank) => {
            let badge = rank === 0 ? '🥇' : rank === 1 ? '🥈' : rank === 2 ? '🥉' : `#${rank + 1}`;
            html += `
                <div class="lb-card">
                    <div>
                        <b style="color:white;">${badge} ${item.name}</b>
                        <div style="font-size:0.8rem; color:#c084fc;">${item.option}</div>
                    </div>
                    <div style="color:#f472b6; font-weight:bold;">${item.count} أصوات</div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    async function castVote(name, option) {
        const key = `${name}_${option}`;
        const newCount = (votesData[key] || 0) + 1;
        const timeStr = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

        votesData[key] = newCount;
        logsData.unshift({ name: name, option: option.replace(/^\d+\//, '').trim(), time: timeStr });
        refreshUI();

        if (_supabase) {
            try {
                await _supabase.from('votes').upsert({ vote_key: key, count: newCount });
                await _supabase.from('logs').insert([{ name: name, option: option.replace(/^\d+\//, '').trim(), time: timeStr }]);
            } catch(e){}
        }
    }

    function switchTab(tabName) {
        document.getElementById('tab-girls').classList.remove('active');
        document.getElementById('tab-boys').classList.remove('active');
        document.getElementById('tab-leaderboard').classList.remove('active');

        document.getElementById('girlsSection').style.display = 'none';
        document.getElementById('boysSection').style.display = 'none';
        document.getElementById('leaderboardSection').style.display = 'none';

        if (tabName === 'girls') {
            document.getElementById('tab-girls').classList.add('active');
            document.getElementById('girlsSection').style.display = 'block';
            document.getElementById('sectionTitleText').innerText = "✨ قائمة الطالبات";
        } else if (tabName === 'boys') {
            document.getElementById('tab-boys').classList.add('active');
            document.getElementById('boysSection').style.display = 'block';
            document.getElementById('sectionTitleText').innerText = "⚡ قائمة الطلاب";
        } else if (tabName === 'leaderboard') {
            document.getElementById('tab-leaderboard').classList.add('active');
            document.getElementById('leaderboardSection').style.display = 'block';
            document.getElementById('sectionTitleText').innerText = "🏆 المتصدرون في التصويت";
        }
    }

    function filterNames() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        document.querySelectorAll('.person-card').forEach(card => {
            const name = card.getAttribute('data-name').toLowerCase();
            card.style.display = name.includes(query) ? 'block' : 'none';
        });
    }

    let clickCount = 0;
    document.getElementById('adminLockIcon').addEventListener('click', () => {
        clickCount++;
        if (clickCount === 3) {
            const pass = prompt("أدخل كلمة سر الأدمن:");
            if (pass === "9014994") {
                document.getElementById('adminSection').style.display = 'block';
            }
            clickCount = 0;
        }
        setTimeout(() => { clickCount = 0; }, 1500);
    });

    function renderAdminLogs() {
        const tbody = document.querySelector('#votesTable tbody');
        if (!tbody) return;
        tbody.innerHTML = '';
        logsData.slice(0, 50).forEach(log => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${log.name}</td><td>${log.option}</td><td>${log.time}</td>`;
            tbody.appendChild(tr);
        });
    }

    async function resetAllData() {
        if (confirm("هل أنت تأكد من مسح جميع الأصوات؟")) {
            if (_supabase) {
                try {
                    await _supabase.from('votes').delete().neq('count', -1);
                    await _supabase.from('logs').delete().neq('id', -1);
                } catch(e){}
            }
            votesData = {}; logsData = [];
            refreshUI();
        }
    }

    // 🚀 التنفيذ الفوري المستقل
    document.getElementById('boysCount').innerText = boysList.length;
    document.getElementById('girlsCount').innerText = girlsList.length;
    
    // رسم البطاقات فوراً قبل الاتصال بالشبكة
    refreshUI();

    // تشغيل الاتصال بالسيرفر في الخلفية
    window.onload = function() {
        try {
            if (window.supabase) {
                _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
