<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>يلا نشوف الفضايح 🤣</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --purple-dark: #3b2554;
            --purple-header: #4c2d6f;
            --purple-btn: #5c3587;
            --bg-light: #f3f3f8;
            --card-bg: #ffffff;
            --text-main: #222222;
            --text-sub: #777777;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-light); min-height: 100vh; color: var(--text-main); padding-bottom: 40px; }

        .hero-header { background: linear-gradient(180deg, #2e1a45 0%, #4a2769 100%); color: white; padding: 25px 20px 45px 20px; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; text-align: center; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .badge-pill { background: rgba(255, 255, 255, 0.15); padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; }
        .admin-lock { cursor: pointer; font-size: 1.1rem; opacity: 0.7; }
        .hero-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 10px; }
        .hero-subtitle { font-size: 0.9rem; opacity: 0.85; margin-bottom: 10px; }

        .container { max-width: 500px; margin: 0 auto; padding: 0 15px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: -30px; margin-bottom: 20px; }
        .stat-card { background: white; border-radius: 15px; padding: 12px 5px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .stat-num { font-size: 1.4rem; font-weight: bold; color: var(--purple-dark); }
        .stat-label { font-size: 0.75rem; color: var(--text-sub); margin-top: 3px; }

        .nav-tabs { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 12px 5px; border: 1px solid #e2e2e8; background: white; color: #444; border-radius: 12px; font-weight: bold; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .tab-btn.active { background: var(--purple-btn); color: white; border-color: var(--purple-btn); }

        .search-box { margin-bottom: 20px; }
        .search-input { width: 100%; padding: 14px 18px; border-radius: 12px; border: 1px solid #e0e0e0; background: white; font-size: 0.95rem; outline: none; }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 5px; }
        .section-title { font-size: 1.1rem; font-weight: bold; color: var(--purple-dark); }
        .section-hint { font-size: 0.75rem; color: var(--text-sub); }

        .person-card { background: white; border-radius: 16px; padding: 18px; margin-bottom: 15px; box-shadow: 0 3px 10px rgba(0,0,0,0.03); }
        .person-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .person-name { font-size: 1.15rem; font-weight: bold; color: #111; }
        .person-rank { font-size: 0.85rem; color: #aaa; font-weight: 600; }

        .options-list { display: flex; flex-direction: column; gap: 10px; }
        .option-item { background: #ffffff; border: 1px solid #eef0f4; border-radius: 12px; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; position: relative; overflow: hidden; }
        .option-progress { position: absolute; top: 0; right: 0; bottom: 0; background: rgba(92, 53, 135, 0.12); z-index: 1; transition: width 0.3s ease; }
        .option-label { position: relative; z-index: 2; font-size: 0.9rem; font-weight: 500; color: #333; }
        .option-val { position: relative; z-index: 2; font-size: 0.85rem; font-weight: bold; color: var(--purple-dark); }

        .lb-card { background: white; border-radius: 12px; padding: 12px 15px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
        .admin-panel { display: none; background: white; padding: 20px; border-radius: 15px; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: right; font-size: 0.85rem; }
        th { background: #f4f4f4; }
    </style>
</head>
<body>

<div class="hero-header">
    <div class="top-bar">
        <span class="badge-pill">دفعتنا تحت المجهر</span>
        <div style="display:flex; gap:10px; align-items:center;">
            <span>♦️ 🤣</span>
            <i class="fas fa-lock admin-lock" id="adminLockIcon"></i>
        </div>
    </div>
    <h1 class="hero-title">يلا نشوف الفضايح</h1>
    <p class="hero-subtitle">اختار التصنيف وشوف النسبة المئوية فوراً.. وتقدر تصوّت لأكثر من صفة!</p>
</div>

<div class="container">
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-num" id="totalVotesCount">0</div>
            <div class="stat-label">تصويت مسجل</div>
        </div>
        <div class="stat-card">
            <div class="stat-num">24</div>
            <div class="stat-label">طالبة</div>
        </div>
        <div class="stat-card">
            <div class="stat-num">29</div>
            <div class="stat-label">طالب</div>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn" onclick="switchTab('boys')">👦 الأولاد</button>
        <button class="tab-btn active" onclick="switchTab('girls')">👩 البنات</button>
        <button class="tab-btn" onclick="switchTab('leaderboard')">🏆 المتصدرون</button>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن اسم..." onkeyup="filterNames()">
    </div>

    <div id="sectionTitleHeader" class="section-header">
        <span class="section-title" id="sectionTitleText">قائمة الطالبات</span>
        <span class="section-hint">اضغط على أي اقتراح للتصويت</span>
    </div>

    <div id="boysSection" style="display:none;"></div>
    <div id="girlsSection"></div>
    <div id="leaderboardSection" style="display:none;"><div id="leaderboardContent"></div></div>

    <div id="adminSection" class="admin-panel">
        <h2>🔒 لوحة التحكم السرية للأدمن</h2>
        <button onclick="resetAllData()" style="background:#dc3545; color:white; border:none; padding:8px 12px; border-radius:6px; margin: 10px 0; cursor:pointer;">إعادة ضبط وتصفير الأصوات ⚠️</button>
        <table id="votesTable">
            <thead>
                <tr><th>المُصوَّت عليه</th><th>الصفة المختارة</th><th>وقت التصويت</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://kstnagfousuiwbnikkwi.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_7xQHPTjLP82fhRQjVY1vfw_nHGBbKKt";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const boysOptions = ["1/الحفار الخسيس 🎓", "2/بتاع الونسه 🫥", "3/الخسيس 😐", "4/نجم الدفعة ♦️", "5/ اجتماعي ❤️", "6/ مبتعد عن الدفعة 😬", "7/ ملك التصرف الساي 🤣", "8/ المهذب❣️", "9/ الطقه والقهوة 🥴", "10/ الموهوم 😶", "11/ البساعد الناس 🤍", "12/ صاحب الضحكه المميزه 🤣🌝", "13/ الخفيف الرشيق"];
    const girlsOptions = ["1/ إجتماعيه ✨", "2/ الحفارة🎓", "3/ السواطة 🤣", "4/ القطيعه 🤣", "5/ المهذبه ❣️", "6/ البعيده عن الدفعه 😐", "7/ نجمة الدفعة ♦️", "8/ العايشه الدور 🤣", "9/ الخسيسه 😶", "10/ أم لساان طويل 👅", "11/ البتنوم في المحاضره😴", "12/ الخفيفه الرشيقه"];

    const boysList = ["منذر", "ايمن", "مجتبى سليمان", "ماهر خالد", "محمد عثمان جاد الله", "محمد حسن", "احمد البشير", "احمد سامي", "حسام المكنه", "محمد عاطف", "اواب", "محمد خالد", "الجيلى", "التجاني", "المثنى مزمل", "عبدالله", "نزار", "أمجد", "عبدالرحيم", "محمد خوجلي", "عبدالرحمن رضوان", "المقداد صلاح", "محمد", "ادم تصرف ساي", "وائل", "مبارك خليل", "عبدالله عبد الله", "الطيب كمال الطيب", "عاصم"];
    const girlsList = ["وعد أمين", "مأب", "نفيسه", "رغده", "مروه", "شهد", "قمر", "رهام", "ساجده", "سبأ", "ريان", "ترتيل", "دعاء", "دلال", "دعاء 2", "سارة", "امنية", "زينب", "ابرار", "ضحى", "مأب التانيه", "شهد محمد", "وعد عامر", "عناب"];

    let votesData = {};
    let logsData = [];

    async function loadData() {
        const { data: votes } = await _supabase.from('votes').select('*');
        if (votes) {
            votesData = {};
            votes.forEach(v => { votesData[v.vote_key] = v.count; });
        }
        const { data: logs } = await _supabase.from('logs').select('*').order('id', { ascending: false });
        if (logs) logsData = logs;
        refreshUI();
    }

    _supabase.channel('public:votes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'votes' }, payload => {
          if (payload.new) {
              votesData[payload.new.vote_key] = payload.new.count;
              refreshUI();
          }
      }).subscribe();

    function renderList(list, options, containerId) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        
        list.forEach((name, index) => {
            const card = document.createElement('div');
            card.className = 'person-card';
            card.setAttribute('data-name', name);
            
            let totalPersonVotes = 0;
            options.forEach(opt => {
                const key = `${name}_${opt}`;
                totalPersonVotes += (votesData[key] || 0);
            });

            let optionsHTML = '';
            options.forEach(opt => {
                const key = `${name}_${opt}`;
                const count = votesData[key] || 0;
                const percent = totalPersonVotes > 0 ? Math.round((count / totalPersonVotes) * 100) : 0;
                const cleanOpt = opt.replace(/^\d+\//, '');

                optionsHTML += `
                    <div class="option-item" onclick="castVote('${name}', '${opt}')">
                        <div class="option-progress" style="width: ${percent}%"></div>
                        <span class="option-label">${cleanOpt}</span>
                        <span class="option-val">${percent}% (${count})</span>
                    </div>
                `;
            });

            card.innerHTML = `
                <div class="person-header">
                    <span class="person-name">${name}</span>
                    <span class="person-rank">#${index + 1}</span>
                </div>
                <div class="options-list">${optionsHTML}</div>
            `;
            container.appendChild(card);
        });
    }

    async function castVote(name, option) {
        const key = `${name}_${option}`;
        const newCount = (votesData[key] || 0) + 1;
        const timeStr = new Date().toLocaleTimeString('ar-EG');

        votesData[key] = newCount;
        refreshUI();

        await _supabase.from('votes').upsert({ vote_key: key, count: newCount });
        await _supabase.from('logs').insert([{ name: name, option: option, time: timeStr }]);
    }

    function refreshUI() {
        renderList(boysList, boysOptions, 'boysSection');
        renderList(girlsList, girlsOptions, 'girlsSection');
        renderLeaderboard();
        renderAdminLogs();
        calculateTotalVotes();
    }

    function calculateTotalVotes() {
        let sum = 0;
        for (let k in votesData) sum += votesData[k];
        document.getElementById('totalVotesCount').innerText = sum;
    }

    function renderLeaderboard() {
        const leaderboard = document.getElementById('leaderboardContent');
        let html = '';
        let hasData = false;

        for (let key in votesData) {
            if (votesData[key] > 0) {
                hasData = true;
                const parts = key.split('_');
                const name = parts[0];
                const option = parts.slice(1).join('_').replace(/^\d+\//, '');
                html += `
                    <div class="lb-card">
                        <div><b>${name}</b></div>
                        <div style="color:var(--purple-btn); font-weight:bold;">${option} (${votesData[key]} صوت)</div>
                    </div>
                `;
            }
        }
        leaderboard.innerHTML = hasData ? html : '<div class="person-card" style="text-align:center;">لا توجد أصوات بعد</div>';
    }

    function filterNames() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll('.person-card').forEach(card => {
            const name = card.getAttribute('data-name').toLowerCase();
            card.style.display = name.includes(q) ? 'block' : 'none';
        });
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('boysSection').style.display = 'none';
        document.getElementById('girlsSection').style.display = 'none';
        document.getElementById('leaderboardSection').style.display = 'none';

        if(tab === 'boys') {
            document.getElementById('boysSection').style.display = 'block';
            document.getElementById('sectionTitleText').innerText = "قائمة الطلاب";
            event.target.classList.add('active');
        } else if(tab === 'girls') {
            document.getElementById('girlsSection').style.display = 'block';
            document.getElementById('sectionTitleText').innerText = "قائمة الطالبات";
            event.target.classList.add('active');
        } else {
            document.getElementById('leaderboardSection').style.display = 'block';
            document.getElementById('sectionTitleText').innerText = "أعلى تصويتات الفضايح 🏆";
            event.target.classList.add('active');
        }
    }

    function renderAdminLogs() {
        const tbody = document.querySelector('#votesTable tbody');
        tbody.innerHTML = '';
        logsData.forEach(log => {
            tbody.innerHTML += `<tr><td>${log.name}</td><td>${log.option}</td><td>${log.time}</td></tr>`;
        });
    }

    let clickCount = 0;
    document.getElementById('adminLockIcon').addEventListener('click', () => {
        clickCount++;
        if (clickCount === 3) {
            const pass = prompt("أدخل كلمة سر الأدمن:");
            if (pass === "9014994") {
                document.getElementById('adminSection').style.display = 'block';
                window.scrollTo(0, document.body.scrollHeight);
            } else {
                alert("كلمة السر خاطئة!");
            }
            clickCount = 0;
        }
        setTimeout(() => clickCount = 0, 1500);
    });

    async function resetAllData() {
        if(confirm("هل أنت تأكد من مسح جميع الأصوات؟")) {
            await _supabase.from('votes').delete().neq('count', -1);
            await _supabase.from('logs').delete().neq('id', -1);
            votesData = {};
            logsData = [];
            refreshUI();
        }
    }

    loadData();
</script>
</body>
</html>
